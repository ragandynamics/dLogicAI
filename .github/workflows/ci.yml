name: dLogicAI CI

on:
  push:
    branches:
      - "feature/**"
      - uat
      - main

  pull_request:
    branches:
      - uat
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.12.4

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @dLogicAI/api build

      - name: Test API
        run: pnpm --filter @dLogicAI/api test

      - name: Validate D1 migrations
        run: pnpm --filter @dLogicAI/api db:migrate:local

      - name: Check frontend
        run: pnpm --filter @dlogicai/web check

      - name: Build frontend
        env:
          PUBLIC_API_BASE_URL: https://ci.invalid
        run: pnpm --filter @dlogicai/web build
